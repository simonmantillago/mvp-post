<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tin · propuestas</title>
<style>
  @font-face { font-family: "UnifrakturCook"; font-weight: 700; src: url(/node_modules/@fontsource/unifrakturcook/files/unifrakturcook-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Antonio; font-weight: 500; src: url(/node_modules/@fontsource/antonio/files/antonio-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: Antonio; font-weight: 700; src: url(/node_modules/@fontsource/antonio/files/antonio-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Libre Caslon Text"; src: url(/node_modules/@fontsource/libre-caslon-text/files/libre-caslon-text-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Libre Caslon Text"; font-style: italic; src: url(/node_modules/@fontsource/libre-caslon-text/files/libre-caslon-text-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Special Elite"; src: url(/node_modules/@fontsource/special-elite/files/special-elite-latin-400-normal.woff2) format("woff2"); }

  :root {
    --ground: #e6d7b8; --surface: #f1e6cc; --text: #2a1c10; --text-soft: #5c4630;
    --accent: #7e1a1c; --on-accent: #f6ead0; --rule: #3a2814; --focus: #7e1a1c; --gold: #9a7630;
    --howler: #8c1d1d; --howler-deep: #571010; --howler-sub: #ecd6b8;
    --stamp-paper: #f6eedb; --stamp-her: #b01f53; --stamp-him: #8a6d2c; --postmark: rgba(42, 28, 16, 0.55); --placeholder: #7a6448;
    --head: Antonio, "Arial Narrow", sans-serif; --body: "Libre Caslon Text", Georgia, serif; --type: "Special Elite", "Courier New", monospace; --mast: "UnifrakturCook", serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  body { background: #17110b; color: #e9dcc0; font: 16px/1.5 var(--body); padding: 48px 16px 96px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .doc { max-width: 1300px; margin: 0 auto 40px; }
  .doc h1 { font: 700 clamp(2.2rem, 6vw, 3.2rem)/1 var(--mast); color: #f1e6cc; }
  .doc p { max-width: 64ch; margin-top: 12px; color: #c9b893; }
  .boards { display: flex; flex-wrap: wrap; gap: 48px 32px; justify-content: center; max-width: 1300px; margin: 0 auto; }
  figure { width: min(390px, 100%); }
  figcaption { margin-top: 16px; }
  figcaption b { display: block; font: 700 1.05rem/1.2 var(--head); letter-spacing: 0.08em; text-transform: uppercase; color: #e0c27a; }
  figcaption span { display: block; margin-top: 6px; font: italic 0.92rem/1.45 var(--body); color: #c9b893; }
  figcaption button { margin-top: 10px; padding: 8px 14px; border-radius: 999px; background: #2a1f14; color: #e0c27a; font: 500 0.8rem/1 var(--head); letter-spacing: 0.1em; text-transform: uppercase; }

  .phone {
    position: relative; height: 844px; overflow: hidden; border-radius: 44px; color: var(--text);
    background: radial-gradient(130% 90% at 50% 45%, transparent 55%, rgba(92, 54, 18, 0.38) 100%), var(--parchment), var(--ground);
    box-shadow: 0 0 0 10px #1b1510, 0 0 0 11px #3a2c1e, 0 40px 80px -30px #000;
  }
  .phone.is-shaking { animation: shake 620ms var(--ease-out); }
  @keyframes shake { 0%, 100% { translate: 0 0; } 15% { translate: -8px 2px; } 30% { translate: 7px -2px; } 45% { translate: -5px 1px; } 60% { translate: 3px 0; } }
  .screen { position: absolute; inset: 0 0 130px; overflow: hidden; padding: 56px 16px 0; display: flex; flex-direction: column; }
  .folio-line { display: flex; gap: 10px; align-items: baseline; padding: 0 3.5rem 8px 0; border-bottom: 1px solid var(--rule); font: 500 0.75rem/1 var(--head); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-soft); }
  .folio-line b { font: 700 1rem/1 var(--mast); letter-spacing: 0; text-transform: none; color: var(--text); }
  .title { margin-top: 16px; text-align: center; font: 700 clamp(2.5rem, 12vw, 3.2rem)/0.95 var(--mast); }
  .dek { margin-top: 8px; padding: 4px 0; border-block: 3px double var(--gold); text-align: center; font: italic 0.875rem/1.3 var(--body); color: var(--text-soft); }
  .list { list-style: none; display: grid; gap: 24px; margin-top: auto; padding: 20px 0 18px; }

  /* Carta base (igual que la app) */
  .letter { position: relative; max-width: 86%; min-height: 5.5rem; padding: 16px 4.5rem 12px 16px; isolation: isolate; filter: drop-shadow(0 7px 9px rgba(60, 35, 10, 0.32)); }
  .letter::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 49.6%, rgba(90, 60, 25, 0.13) 50%, rgba(255, 250, 235, 0.35) 50.6%, transparent 52%), var(--sheet), var(--surface); clip-path: polygon(0 1.9px, 14% 2.4px, 29% 2.2px, 43% 0.1px, 57% 2.8px, 71% 2.7px, 86% 1.4px, 100% 1.6px, calc(100% - 1.7px) 25%, calc(100% - 0.8px) 50%, calc(100% - 2.3px) 75%, 100% calc(100% - 2.4px), 86% calc(100% - 1.9px), 71% 100%, 57% calc(100% - 0.6px), 43% calc(100% - 2.9px), 29% calc(100% - 0.9px), 14% calc(100% - 1.6px), 0 calc(100% - 0.6px), 2.1px 75%, 2.7px 50%, 1.1px 25%); }
  .letter--theirs { justify-self: start; rotate: -0.8deg; }
  .letter--mine { justify-self: end; rotate: 0.6deg; }
  .letter p:first-child { font: 1rem/1.55 var(--body); }
  .letter--him p:first-child { font-family: var(--type); }
  .letter .sign { margin-top: 8px; font: italic 0.75rem/1.3 var(--body); color: var(--text-soft); }
  .stamp-wrap { position: absolute; top: 12px; right: 12px; width: 3.25rem; height: 4.5rem; }
  .stamp { position: absolute; top: 0; right: 0; width: 2.9rem; height: 3.5rem; padding: 4px; background: var(--stamp-paper); rotate: 4deg;
    -webkit-mask: radial-gradient(circle 2.4px at 50% 50%, transparent 98%, #000) -3px -3px / 6px 6px, linear-gradient(#000 0 0) center / calc(100% - 6px) calc(100% - 6px) no-repeat;
            mask: radial-gradient(circle 2.4px at 50% 50%, transparent 98%, #000) -3px -3px / 6px 6px, linear-gradient(#000 0 0) center / calc(100% - 6px) calc(100% - 6px) no-repeat; }
  .stamp i { display: grid; place-items: center; height: 100%; color: var(--stamp-paper); font: 700 0.6875rem/1 var(--head); font-style: normal; }
  .stamp--her i { background: var(--stamp-her); }
  .stamp--him i { background: var(--stamp-him); }
  .postmark { position: absolute; top: 1.6rem; right: 0.9rem; width: 3.25rem; height: 3.25rem; color: var(--postmark); rotate: -14deg; }

  /* ── Redactar: recuadro y botones redondeados (común a las tres) ── */
  .compose { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; padding: 12px 16px 30px; background: var(--parchment), var(--ground); border-top: 3px double var(--gold); }
  .input { width: 100%; min-height: 2.9rem; padding: 10px 16px; resize: none; border: 1px solid rgba(92, 70, 48, 0.55); border-radius: 22px; background: var(--surface); font: 1rem/1.4 var(--type); color: var(--text); caret-color: var(--accent); box-shadow: inset 0 1px 3px rgba(60, 35, 10, 0.15); }
  .input::placeholder { color: var(--placeholder); }
  .send { flex: none; width: 2.9rem; height: 2.9rem; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 8px -3px rgba(60, 10, 10, 0.6); }

  /* ═════ Opción 1 · Telegrama ═════ */
  .o1 .compose-row { display: flex; gap: 8px; align-items: end; }
  .o1 .tin-btn { flex: none; height: 2.9rem; padding: 0 16px 0 12px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: var(--howler); color: var(--on-accent); font: 700 1rem/1 var(--head); letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 4px 8px -4px rgba(60, 10, 10, 0.7); }
  .o1 .tin-btn svg { width: 20px; height: 20px; }
  .o1 .tin { justify-self: center; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px; border-radius: 18px; background: linear-gradient(var(--howler), var(--howler-deep)); color: var(--on-accent); box-shadow: 0 8px 16px -10px rgba(40, 8, 8, 0.8); }
  .o1 .tin svg { flex: none; width: 34px; height: 34px; }
  .o1 .tin b { display: block; font: 700 1.35rem/1 var(--head); text-transform: uppercase; letter-spacing: 0.02em; }
  .o1 .tin small { display: block; margin-top: 3px; font: italic 0.8125rem/1.2 var(--body); color: var(--howler-sub); }
  .o1 .tin.is-arriving { animation: pop 700ms var(--ease-out) both; }
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 55% { transform: scale(1.08); opacity: 1; } 100% { transform: none; } }

  /* ═════ Opción 2 · Sobre rojo ═════ */
  .o2 .compose-row { display: flex; gap: 8px; align-items: end; }
  .o2 .tin-btn { flex: none; width: 2.9rem; height: 2.9rem; display: grid; place-items: center; border-radius: 50%; color: var(--on-accent); font: 700 0.8125rem/1 var(--head); letter-spacing: 0.06em; text-transform: uppercase;
    background: radial-gradient(circle at 38% 32%, #e0706a, #a3262a 45%, #4f0c0e); box-shadow: 0 4px 8px -3px rgba(60, 10, 10, 0.7), inset 0 0 0 3px rgba(79, 12, 14, 0.45); }
  .o2 .tin { position: relative; width: 11.5rem; aspect-ratio: 1.55; border-radius: 6px; color: var(--on-accent); background: linear-gradient(var(--howler), var(--howler-deep)); box-shadow: 0 10px 18px -10px rgba(40, 8, 8, 0.85); overflow: hidden; }
  .o2 .tin--mine { justify-self: end; rotate: 2deg; }
  .o2 .tin--theirs { justify-self: start; rotate: -2deg; }
  .o2 .tin svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; color: rgba(40, 6, 6, 0.55); }
  .o2 .tin .seal { position: absolute; left: 50%; top: 46%; translate: -50% -50%; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #e0706a, #a3262a 45%, #4f0c0e); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.35); }
  .o2 .tin b { position: absolute; left: 10px; top: 8px; font: 700 1.1rem/1 var(--mast); }
  .o2 .tin small { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font: italic 0.75rem/1.2 var(--body); color: var(--howler-sub); }
  .o2 .tin.is-arriving { animation: fly 900ms var(--ease-out) both; }
  @keyframes fly { 0% { transform: translate(-60%, -120%) rotate(-24deg) scale(0.7); opacity: 0; } 70% { transform: translate(2%, 4%) rotate(4deg); opacity: 1; } 100% { transform: none; } }

  /* ═════ Opción 3 · Lacre en el margen ═════ */
  .o3 .compose-row { display: flex; gap: 8px; align-items: end; }
  .o3 .tin-btn { flex: none; height: 2.9rem; padding: 0 14px 0 8px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; border: 1.5px solid var(--gold); color: var(--accent); background: rgba(246, 238, 219, 0.55); font: 700 1rem/1 var(--head); letter-spacing: 0.06em; text-transform: uppercase; }
  .o3 .tin-btn i { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #e0706a, #a3262a 45%, #4f0c0e); }
  .o3 .tin { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; }
  .o3 .tin::before, .o3 .tin::after { content: ""; height: 0; border-top: 3px double var(--gold); }
  .o3 .tin div { display: grid; justify-items: center; gap: 4px; }
  .o3 .tin .seal { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); font: 700 1.05rem/1 var(--mast);
    background: radial-gradient(circle at 38% 32%, #e0706a, #a3262a 45%, #4f0c0e); box-shadow: 0 3px 5px rgba(60, 10, 10, 0.4), inset 0 0 0 4px rgba(79, 12, 14, 0.4); }
  .o3 .tin small { font: italic 0.8125rem/1.25 var(--body); color: var(--accent); }
  .o3 .tin.is-arriving .seal { animation: stampdown 650ms var(--ease-out) both; }
  @keyframes stampdown { 0% { transform: scale(2.2); opacity: 0; } 60% { transform: scale(0.92); opacity: 1; } 100% { transform: none; } }

  @media (prefers-reduced-motion: reduce) { .phone.is-shaking, .is-arriving, .is-arriving .seal { animation: none !important; } }
</style>
</head>
<body>
<header class="doc">
  <h1>El Tin, más chico</h1>
  <p>Tres maneras de mostrar el Tin en la conversación, cada una con su botón. Las tres usan el recuadro de escribir y los botones redondeados. Toca «Tin» en cada teléfono para ver cómo llega.</p>
</header>

<main class="boards">
  <template id="screen">
    <div class="screen">
      <p class="folio-line"><b>The MVP Post</b><span>Martes, 3 nov</span><span>Pág. 6</span></p>
      <h2 class="title">Cartas mágicas</h2>
      <p class="dek">Correo por lechuza · entrega inmediata</p>
      <ol class="list">
        <li class="letter letter--mine letter--her"><p>¿Vemos algo esta noche? Yo pongo las cobijas.</p><p class="sign">— María Victoria · 3 nov, 21:59</p>
          <span class="stamp-wrap"><span class="stamp stamp--her"><i>MVP</i></span><svg class="postmark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="22" cy="32" r="17"/><circle cx="22" cy="32" r="13"/><path d="M42 24c4-3 8 3 12 0s8 3 10 0M42 32c4-3 8 3 12 0s8 3 10 0M42 40c4-3 8 3 12 0s8 3 10 0"/></svg></span></li>
        <li class="letter letter--theirs letter--him"><p>Trato hecho. Llevo las palomitas.</p><p class="sign">— Simón · 3 nov, 22:03</p>
          <span class="stamp-wrap"><span class="stamp stamp--him"><i>SMG</i></span><svg class="postmark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="22" cy="32" r="17"/><circle cx="22" cy="32" r="13"/><path d="M42 24c4-3 8 3 12 0s8 3 10 0M42 32c4-3 8 3 12 0s8 3 10 0M42 40c4-3 8 3 12 0s8 3 10 0"/></svg></span></li>
        <!--tin-->
      </ol>
    </div>
  </template>

  <figure class="o1">
    <div class="phone" data-tin='<li class="tin"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="7" width="26" height="18" rx="2"/><path d="m3 9 13 9 13-9"/><circle cx="16" cy="18" r="3.2" fill="currentColor" stroke="none"/></svg><div><b>¡Tin! ¡Tin!</b><small>Simón quiere tin · 22:07</small></div></li>'>
      <div class="compose"><div class="compose-row">
        <button class="tin-btn" type="button" data-send><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 8 9 6 9-6"/></svg>Tin</button>
        <textarea class="input" rows="1" placeholder="Escribe tu carta…" aria-label="Escribe tu carta"></textarea>
        <button class="send" type="button" aria-label="Enviar carta"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3C12 4 7 9 5 17l-1 4M20 3c-1 6-5 10-11 11M8.5 11.5 13 9"/></svg></button>
      </div></div>
    </div>
    <figcaption><b>1 · Telegrama</b><span>El Tin es una tarjeta roja centrada, del tamaño de un mensaje, con un sobrecito y «Simón quiere tin». El botón es una píldora roja a la izquierda del recuadro, así todo cabe en una sola fila.</span><button type="button" data-replay>Ver llegada</button></figcaption>
  </figure>

  <figure class="o2">
    <div class="phone" data-tin='<li class="tin tin--theirs"><svg class="lines" viewBox="0 0 186 120" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M0 0 93 58 186 0M0 120l70-52M186 120l-70-52"/></svg><b>¡Tin!</b><span class="seal"></span><small>Simón quiere tin · 22:07</small></li>'>
      <div class="compose"><div class="compose-row">
        <textarea class="input" rows="1" placeholder="Escribe tu carta…" aria-label="Escribe tu carta"></textarea>
        <button class="tin-btn" type="button" data-send aria-label="Pedir tin">Tin</button>
        <button class="send" type="button" aria-label="Enviar carta"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3C12 4 7 9 5 17l-1 4M20 3c-1 6-5 10-11 11M8.5 11.5 13 9"/></svg></button>
      </div></div>
    </div>
    <figcaption><b>2 · Sobre rojo</b><span>El Tin llega como un sobre rojo cerrado, chico, del lado de quien lo mandó, como una carta más. Entra volando y se sacude. El botón es un lacre redondo con «Tin», al lado del de enviar.</span><button type="button" data-replay>Ver llegada</button></figcaption>
  </figure>

  <figure class="o3">
    <div class="phone" data-tin='<li class="tin"><div><span class="seal"></span><small>Simón quiere tin · 22:07</small></div></li>'>
      <div class="compose"><div class="compose-row">
        <button class="tin-btn" type="button" data-send><i></i>Tin</button>
        <textarea class="input" rows="1" placeholder="Escribe tu carta…" aria-label="Escribe tu carta"></textarea>
        <button class="send" type="button" aria-label="Enviar carta"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3C12 4 7 9 5 17l-1 4M20 3c-1 6-5 10-11 11M8.5 11.5 13 9"/></svg></button>
      </div></div>
    </div>
    <figcaption><b>3 · Lacre en el margen</b><span>La más discreta. El Tin es un lacre vino que cae estampado entre dos filetes dorados, con «Simón quiere tin» debajo, como una nota entre cartas. El botón es una píldora clara con borde dorado y su lacre.</span><button type="button" data-replay>Ver llegada</button></figcaption>
  </figure>
</main>

<script>
  function paper(w, base, fibers, stains, seed) {
    let s = seed; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647)
    const c = document.createElement('canvas'); c.width = c.height = w; const g = c.getContext('2d')
    g.fillStyle = base; g.fillRect(0, 0, w, w)
    for (let i = 0; i < stains; i++) { const x = rnd() * w, y = rnd() * w, r = 40 + rnd() * 140, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(140,95,40,${0.05 + rnd() * 0.08})`); gr.addColorStop(1, 'rgba(140,95,40,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2) }
    const img = g.getImageData(0, 0, w, w), d = img.data; for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.8 } g.putImageData(img, 0, 0)
    for (let i = 0; i < fibers; i++) { const x = rnd() * w, y = rnd() * w, a = rnd() * Math.PI, l = 6 + rnd() * 26; g.strokeStyle = `rgba(${rnd() < 0.5 ? '90,60,25' : '255,248,230'},${0.08 + rnd() * 0.12})`; g.lineWidth = 0.6 + rnd() * 0.6; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke() }
    return `url(${c.toDataURL()})`
  }
  document.documentElement.style.setProperty('--parchment', paper(420, '#e2d1ad', 900, 26, 7))
  document.documentElement.style.setProperty('--sheet', paper(320, '#efe3c6', 500, 10, 31))

  const tpl = document.getElementById('screen').innerHTML
  document.querySelectorAll('.phone').forEach((p) => {
    p.insertAdjacentHTML('afterbegin', tpl.replace('<!--tin-->', p.dataset.tin))
    const arrive = () => {
      const t = p.querySelector('.tin'); p.classList.remove('is-shaking'); t.classList.remove('is-arriving'); void p.offsetWidth
      p.classList.add('is-shaking'); t.classList.add('is-arriving')
    }
    p.querySelector('[data-send]').onclick = arrive
    p.closest('figure').querySelector('[data-replay]').onclick = arrive
    setTimeout(arrive, 600)
  })
</script>
</body>
</html>
