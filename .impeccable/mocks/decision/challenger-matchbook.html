<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Antonio:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden;background:#0f0f0f;color:#c9a24a;font-family:Antonio,sans-serif}
.head{padding:22px 18px 0;text-align:center}
.head h1{font:400 44px/1 "Pinyon Script"}
.head p{font-size:11px;letter-spacing:.3em;color:#8d7a4a;margin-top:6px}
.fan{position:relative;height:560px;margin-top:20px}
.mb{position:absolute;width:210px;height:330px;left:90px;top:120px;border-radius:6px;padding:18px 16px;box-shadow:0 18px 30px rgba(0,0,0,.6)}
.mb .strike{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(90deg,#5a5a5a 0 2px,#6b6b6b 2px 4px);border-radius:0 0 6px 6px}
.mb h2{font:400 34px/1 "Pinyon Script";color:#d9b65c}
.mb p{font-size:11px;letter-spacing:.2em;margin-top:8px;color:#d9b65c}
.mb .sky{position:absolute;left:16px;right:16px;bottom:48px;height:40px;background:linear-gradient(#d9b65c,#d9b65c) bottom/100% 3px no-repeat;clip-path:polygon(0 100%,0 60%,10% 60%,10% 30%,16% 30%,16% 70%,30% 70%,30% 10%,34% 0,38% 10%,38% 70%,55% 70%,55% 40%,65% 40%,65% 80%,80% 80%,80% 50%,90% 50%,90% 100%);background:#d9b65c}
.a{background:#4a1520;transform:rotate(-16deg) translate(-70px,10px)}
.b{background:#173a2c;transform:rotate(14deg) translate(70px,10px)}
.c{background:#1b1b1b;border:1px solid #3a3a3a}
.c h2{font-size:30px}
.foot{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.3em;color:#6b5c38}
</style></head><body>
<div class="head"><h1>The MVP Post</h1><p>CLUBES DE MANHATTAN · EDICIÓN N.º 1</p></div>
<div class="fan">
  <div class="mb a"><h2>Vinilos de Big</h2><p>PENTHOUSE · PÁG. 4</p><div class="sky"></div><div class="strike"></div></div>
  <div class="mb b"><h2>Cartelera</h2><p>VIDEOCLUB · PÁG. 5</p><div class="sky"></div><div class="strike"></div></div>
  <div class="mb c"><h2>¿Y si el amor fuera una suscripción?</h2><p>LA COLUMNA · POR SIMÓN</p><div class="sky"></div><div class="strike"></div></div>
</div>
<div class="foot">SMG DEVELOPMENT®</div>
</body></html>
