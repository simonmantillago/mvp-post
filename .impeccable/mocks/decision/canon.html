<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>App de pareja estándar</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:390px;height:844px;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#2d2a32;background:#fff5f7;position:relative}
  .head{padding:60px 22px 0;display:flex;justify-content:space-between;align-items:center}
  h1{font-size:26px}
  .av{display:flex}.av i{width:36px;height:36px;border-radius:50%;background:#f8bbd0;border:2px solid #fff;margin-left:-8px}
  .days{margin:22px 22px 0;padding:22px;border-radius:20px;background:#fff;box-shadow:0 4px 14px rgba(45,42,50,.08)}
  .days b{display:block;font-size:40px;color:#c2185b}
  .grid{margin:18px 22px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{height:130px;padding:16px;border-radius:18px;background:#fff;box-shadow:0 4px 14px rgba(45,42,50,.08);display:flex;flex-direction:column;justify-content:space-between}
  .card i{width:34px;height:34px;border-radius:10px;background:#fce4ec}
  .card strong{font-size:17px}
  .tabs{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #f3d6de;display:flex;justify-content:space-around;align-items:center;font-size:12px}
  .tabs span:first-child{color:#c2185b;font-weight:600}
</style></head><body>
  <div class="head"><h1>Hola, María Victoria</h1><div class="av"><i></i><i></i></div></div>
  <div class="days">Juntos hace<b>412 días</b></div>
  <div class="grid">
    <div class="card"><i></i><strong>Paparazzi</strong></div>
    <div class="card"><i></i><strong>Mensajes</strong></div>
    <div class="card"><i></i><strong>CD Player</strong></div>
    <div class="card"><i></i><strong>Blockbuster</strong></div>
  </div>
  <div class="tabs"><span>Inicio</span><span>Fotos</span><span>Chat</span><span>Música</span><span>Ajustes</span></div>
</body></html>
