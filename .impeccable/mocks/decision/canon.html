<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden;background:#fff6f9;color:#1f1f24;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
.top{padding:56px 20px 16px;display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:#ffc6d8;border:3px solid #fff}
.av+.av{margin-left:-22px;background:#d7c6ff}
.top h1{font-size:22px;font-weight:700}
.top p{font-size:13px;color:#7a7a85}
.days{margin:0 20px;background:#ff8fb1;color:#fff;border-radius:20px;padding:18px}
.days b{font-size:34px;display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 20px}
.card{background:#fff;border-radius:18px;padding:16px;height:120px;box-shadow:0 4px 14px rgba(255,143,177,.15)}
.card i{display:block;width:28px;height:28px;border-radius:8px;background:#ffe1ea;margin-bottom:22px}
.card b{font-size:15px}
.card span{display:block;font-size:12px;color:#7a7a85;margin-top:2px}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid #f0e3e8;display:flex;justify-content:space-around;padding-top:12px}
.tab div{width:26px;height:26px;border-radius:8px;background:#f3e6eb}
.tab div:first-child{background:#ff8fb1}
</style></head><body>
<div class="top"><div class="av"></div><div class="av"></div><div><h1>Hola, María Victoria</h1><p>Simón te escribió algo nuevo</p></div></div>
<div class="days"><b>365 días</b>juntos y contando</div>
<div class="cards">
  <div class="card"><i></i><b>Fotos</b><span>12 recuerdos</span></div>
  <div class="card"><i></i><b>Música</b><span>3 dedicatorias</span></div>
  <div class="card"><i></i><b>Películas</b><span>Elige ella</span></div>
  <div class="card"><i></i><b>Chat</b><span>2 sin leer</span></div>
</div>
<div class="tab"><div></div><div></div><div></div><div></div></div>
</body></html>
