[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Un trozo de código que ya no existe (versión vieja abierta en el iPhone) debe dar 404, no index.html:
# así la app lo detecta y se recarga sola (src/lib/recover.ts)
[[redirects]]
  from = "/assets/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Archivos con hash en el nombre: nunca cambian, se guardan para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El service worker y el manifiesto se revisan siempre, para que las versiones nuevas lleguen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
